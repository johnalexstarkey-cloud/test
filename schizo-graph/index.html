<title>The Graph Knows</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Permanent+Marker&family=Source+Sans+3:wght@600;700&display=swap">
<style>
  /* Layout: the graph is a full-bleed evidence board; the HUD is pinned to its corners like case tags */
  :root {
    --ink: #15171c;
    --void: #060709;
    --hull: #23262e;
    --hull-hot: #30232a;
    --node: #f1f2f5;
    --label: #eceef3;
    --cluster: #8b909c;
    --edge: rgba(190, 197, 212, 0.2);
    --dash: rgba(190, 197, 212, 0.15);
    --strong: rgba(236, 239, 246, 0.82);
    --bridge: #8d98f2;
    --string: #e3342b;
    --scrawl: #ff4b3e;
    --hud: #9ea4b1;
    --hud-dim: #636978;
    --line: rgba(255, 255, 255, 0.26);
    --panel: rgba(15, 17, 22, 0.86);
    --font-label: "Source Sans 3", "Source Sans Pro", "Segoe UI", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --font-scrawl: "Permanent Marker", "Marker Felt", "Comic Sans MS", cursive;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--hud);
    font-family: var(--font-mono);
    overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #board {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; cursor: crosshair; touch-action: none;
  }
  #board.over { cursor: pointer; }

  .top {
    position: fixed; top: 0; left: 0;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    display: flex; flex-direction: column; gap: 8px;
    pointer-events: none;
  }
  h1 {
    margin: 0;
    font-family: var(--font-scrawl); font-weight: 400;
    font-size: clamp(24px, 3vw, 34px); line-height: 1;
    color: var(--scrawl);
    transform: rotate(-2.5deg); transform-origin: left center;
    text-shadow: 0 2px 0 var(--void);
  }
  .rec {
    margin: 0; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }
  .rec .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--string); animation: rec 1.2s steps(2, jump-none) infinite; }
  .rec .meta { color: var(--hud-dim); }
  @keyframes rec { 50% { opacity: 0.15; } }

  .log {
    position: fixed; top: 0; right: 0;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    width: min(400px, 38vw);
    display: flex; flex-direction: column; gap: 1px;
    font-size: 11px; line-height: 1.45;
    pointer-events: none;
  }
  .log p { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--hud); }
  .log p .t { color: var(--hud-dim); }
  .log p.warn { color: var(--scrawl); }
  .log p:nth-child(n+3) { opacity: 0.7; }
  .log p:nth-child(n+5) { opacity: 0.42; }
  .log p:nth-child(n+7) { opacity: 0.2; }

  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
    pointer-events: none;
  }
  .unrec {
    margin: 0; font-family: var(--font-label); font-weight: 600; font-size: 13px;
    color: var(--cluster); white-space: nowrap;
  }
  .unrec.hot { color: var(--scrawl); }
  .controls {
    pointer-events: auto;
    display: flex; align-items: center; gap: 10px 16px;
    padding: 10px 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .controls label {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  }
  .controls output { color: var(--label); min-width: 3ch; text-align: right; font-variant-numeric: tabular-nums; }
  #paranoia { width: 150px; accent-color: var(--string); }
  .mood { font-family: var(--font-scrawl); font-size: 15px; color: var(--scrawl); min-width: 16ch; }
  .btns { display: flex; gap: 8px; }
  button {
    font: 600 11px var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--label); background: transparent;
    border: 1px solid var(--line); border-radius: 3px;
    padding: 8px 11px; cursor: pointer; white-space: nowrap;
  }
  button:hover { border-color: var(--string); }
  button.primary { background: var(--string); border-color: var(--string); color: var(--node); }
  button.primary:hover { background: var(--scrawl); }
  button:focus-visible, #paranoia:focus-visible { outline: 2px solid var(--scrawl); outline-offset: 2px; }

  @media (max-width: 760px) {
    .log {
      left: 0; right: 0; width: auto;
      top: calc(96px + env(safe-area-inset-top, 0px)); padding-top: 0;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      font-size: 10px;
    }
    .log p:nth-child(n+4) { display: none; }
    .bottom { flex-direction: column; align-items: stretch; gap: 8px; }
    .controls { display: grid; grid-template-columns: auto minmax(0, 1fr); }
    #paranoia { width: 100%; }
    .mood, .btns { grid-column: 1 / -1; }
    .btns button { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .rec .dot { animation: none; }
  }
</style>

<canvas id="board" role="img" aria-label="Animated network map of eight online friend groups, redrawn as a conspiracy board with red string, scribbled notes and watching eyes"></canvas>

<script>
(() => {
  'use strict';

  // ---------- helpers ----------
  const TAU = Math.PI * 2;
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const rand = Math.random;
  const R = (a, b) => a + rand() * (b - a);
  const pick = (a) => a[(rand() * a.length) | 0];
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  function mulberry32(a) {
    return () => {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const srand = mulberry32(0x3333);

  const css = getComputedStyle(document.documentElement);
  const tok = (k) => css.getPropertyValue(k).trim();
  const COL = {
    bg: tok('--ink'), void: tok('--void'), hull: tok('--hull'), hullHot: tok('--hull-hot'),
    node: tok('--node'), label: tok('--label'), cluster: tok('--cluster'),
    edge: tok('--edge'), dash: tok('--dash'), strong: tok('--strong'),
    bridge: tok('--bridge'), string: tok('--string'), scrawl: tok('--scrawl'),
    hud: tok('--hud'), panel: tok('--panel'),
  };
  const F_LABEL = tok('--font-label'), F_MONO = tok('--font-mono'), F_SCRAWL = tok('--font-scrawl');
  const rgba = (hex, a) => {
    const h = hex.replace('#', '');
    return `rgba(${parseInt(h.slice(0, 2), 16)},${parseInt(h.slice(2, 4), 16)},${parseInt(h.slice(4, 6), 16)},${a})`;
  };

  // ---------- the graph, as recorded ----------
  const CLUSTERS = [
    { key: 'seminar', name: 'THE SEMINAR', lx: 573, ly: 161, alt: ['THE SEMINAR IS LISTENING', 'THE SEMINAR NEVER ADJOURNS', 'SEMINAR = SEMAPHORE?'] },
    { key: 'duel', name: 'THE EPISTEMOLOGY DUEL', lx: 920, ly: 94, alt: ['BUT HOW DO YOU KNOW', 'THE DUEL WAS STAGED'] },
    { key: 'salon', name: "JERE'S SALON", lx: 1199, ly: 55, alt: ["JERE'S SALON (A FRONT)", 'WHO IS JERE REALLY'] },
    { key: 'bit', name: 'THE BIT CREW', lx: 1663, ly: 236, alt: ['IT WAS NEVER A BIT', 'THE BIT IS LOAD-BEARING'] },
    { key: 'axiom', name: 'THE AXIOM CORNER', lx: 197, ly: 1028, alt: ['THEY CORNERED THE AXIOMS', 'AXIOMS ARE JUST ASSUMPTIONS'] },
    { key: 'brawl', name: 'THE POLITICS BRAWL', lx: 582, ly: 1146, alt: ['THE BRAWL IS SCRIPTED', 'BOTH SIDES ARE ONE SIDE'] },
    { key: 'free', name: 'FREE AGENTS', lx: 957, ly: 1096, alt: ['NOBODY IS FREE', '"FREE" AGENTS'] },
    { key: 'builders', name: 'THE BUILDERS', lx: 1360, ly: 1096, alt: ['WHAT ARE THEY BUILDING', 'DO NOT ASK THE BUILDERS'] },
  ];
  // [name, x, y, radius, label side: r | l | t | b]
  const PEOPLE = {
    seminar: [['Rem', 371, 275, 7], ['Charlie', 581, 298, 8], ['Olang', 657, 322, 6], ['Jambe', 541, 380, 9], ['Woolier', 562, 439, 9, 't'],
      ['vannak', 642, 405, 9, 'b'], ['Harpo', 732, 405, 7], ['Gloomies', 359, 426, 6], ['synth.wav', 621, 457, 9], ['Youv', 534, 490, 13],
      ['hpaigecr', 641, 503, 15, 'b'], ['Hugh', 698, 490, 21], ['Awesomebillf…', 566, 548, 6, 'l'], ['Rn!', 481, 563, 6, 'b'], ['Ixtlimal', 580, 613, 6]],
    duel: [['mentanje', 938, 167, 7], ['Zone', 883, 230, 8, 'l'], ['SuperVillainy', 938, 249, 14]],
    salon: [['BryGonKissTh…', 1163, 128, 6], ['Taliban Chud…', 1273, 168, 6, 'l'], ['saint.', 1315, 260, 7], ['xayori', 1207, 281, 7], ['Puck', 1247, 316, 8],
      ['bardiel', 1158, 312, 11, 'b'], ['Jere', 1100, 336, 18, 't'], ['Dot', 1207, 366, 14], ['aura', 1137, 403, 16]],
    bit: [['b. rodent', 1665, 372, 7], ['Water.BLUE', 1761, 413, 6, 'l'], ['resputin', 1845, 412, 6], ['Jack', 1525, 462, 12], ['February2084', 1596, 490, 11, 'l'],
      ['Digleb', 1725, 467, 6], ['El Don', 1761, 518, 6, 'l'], ['My Name', 1540, 563, 17, 'l'], ['FenceJumper', 1642, 558, 8], ['OkPhilosopher', 1448, 591, 11, 'l'],
      ['BigC', 1713, 594, 7], ['Zack', 1554, 683, 11], ['mohanid', 1641, 690, 5, 'b'], ['Meliorne', 1720, 692, 8]],
    axiom: [['timebag', 195, 715, 7], ['Simon', 221, 769, 11], ['Bedbug', 189, 825, 8], ['Jeh', 292, 841, 8], ['n. qualia', 248, 972, 7]],
    brawl: [['Ape', 637, 766, 13], ['Angel', 646, 843, 16, 'l'], ['boss', 709, 828, 11], ['Comte', 502, 836, 7, 'l'], ['Nikkolas Mical', 531, 934, 6, 'l'], ['lizzie', 545, 1031, 7]],
    free: [['Willow', 940, 750, 7, 'l'], ['A. Johnson', 1022, 772, 9], ['Stackhouse', 975, 844, 12], ['Pearl', 884, 1041, 6]],
    builders: [['Brutus', 1300, 783, 18, 'l'], ['Janne', 1372, 794, 11], ['papagaio', 1252, 866, 13, 'l'], ['thunderstud', 1312, 866, 14, 'b'], ['Neura', 1447, 881, 9, 't'], ['ovcharr', 1391, 1041, 6]],
  };
  // unnamed members
  const DOTS = {
    seminar: [[565, 234], [512, 271], [474, 345], [439, 453], [487, 430], [478, 497], [431, 518], [644, 553], [697, 561], [745, 526], [753, 462], [685, 432], [606, 348]],
    duel: [],
    salon: [[1343, 182], [1378, 232], [1219, 229], [1166, 217], [1097, 226], [1057, 268], [1121, 272], [1059, 322], [1293, 348], [1261, 402], [1182, 438]],
    bit: [[1671, 310], [1730, 342], [1533, 385], [1575, 418], [1640, 440], [1480, 430], [1665, 495], [1495, 527], [1588, 545], [1618, 608], [1570, 620],
      [1517, 612], [1451, 647], [1823, 526], [1935, 456], [1926, 576], [1911, 627], [1777, 655], [1789, 716], [1731, 752]],
    axiom: [[128, 788], [68, 815], [237, 882]],
    brawl: [[579, 800], [600, 895], [658, 918], [482, 1027], [515, 1091], [590, 1071]],
    free: [[913, 867], [951, 920], [1011, 900]],
    builders: [[1274, 820], [1362, 838], [1238, 925], [1273, 962], [1337, 955], [1452, 957], [1513, 888], [1509, 950], [1415, 850]],
  };
  const STRONG = [
    ['Hugh', 'hpaigecr'], ['Hugh', 'synth.wav'], ['Hugh', 'Harpo'], ['Hugh', 'vannak'], ['Hugh', 'Olang'], ['hpaigecr', 'Youv'], ['hpaigecr', 'Woolier'],
    ['hpaigecr', 'vannak'], ['Youv', 'Woolier'], ['Youv', 'Jambe'], ['Youv', 'Awesomebillf…'],
    ['Zone', 'SuperVillainy'], ['mentanje', 'SuperVillainy'],
    ['Jere', 'bardiel'], ['Jere', 'Dot'], ['Jere', 'aura'], ['bardiel', 'aura'], ['bardiel', 'Dot'], ['Dot', 'aura'], ['Dot', 'Puck'], ['Dot', 'saint.'],
    ['Puck', 'saint.'], ['bardiel', 'xayori'],
    ['Jack', 'My Name'], ['February2084', 'My Name'], ['February2084', 'Jack'], ['February2084', 'b. rodent'], ['My Name', 'OkPhilosopher'], ['My Name', 'Zack'],
    ['Jack', 'OkPhilosopher'],
    ['timebag', 'Simon'], ['Simon', 'Bedbug'], ['Simon', 'Jeh'],
    ['Ape', 'Angel'], ['Angel', 'boss'],
    ['Stackhouse', 'A. Johnson'],
    ['Brutus', 'Janne'], ['Brutus', 'papagaio'], ['Brutus', 'thunderstud'], ['papagaio', 'thunderstud'], ['Janne', 'thunderstud'], ['Janne', 'Neura'],
  ];
  // [a, b, bend, badge, thick]
  const BRIDGES = [
    ['Rem', 'Zone', -0.13, 0, 0], ['Charlie', 'Jere', 0.03, 0, 1], ['Dot', 'FenceJumper', -0.04, 3, 1], ['saint.', 'FenceJumper', 0.05, 3, 1],
    ['Rn!', 'timebag', 0.1, 3, 1], ['mentanje', 'Willow', 0.02, 0, 0], ['Hugh', 'aura', -0.06, 0, 0], ['Nikkolas Mical', 'aura', 0.05, 0, 0],
    ['Rem', 'hpaigecr', 0.04, 0, 0], ['Hugh', 'Ixtlimal', 0.05, 0, 0], ['Hugh', 'Brutus', -0.03, 0, 0], ['Bedbug', 'Stackhouse', 0.1, 0, 0],
    ['n. qualia', 'thunderstud', 0.13, 0, 0], ['lizzie', 'My Name', -0.05, 0, 0], ['Jere', 'Digleb', -0.05, 0, 0], ['Jere', 'El Don', -0.03, 0, 0],
    ['Jack', 'FenceJumper', 0.1, 0, 0],
  ];

  // ---------- build ----------
  const nodes = [], byName = new Map(), clusters = [];
  function addNode(name, x, y, r, side, cl) {
    const n = {
      i: nodes.length, name, x, y, hx: x, hy: y, vx: 0, vy: 0, r, side, cl, tiny: !name, deg: 0,
      ph: [R(0, TAU), R(0, TAU), R(0, TAU), R(0, TAU)], fr: [R(0.25, 0.6), R(0.25, 0.6)],
      flash: 0, gUntil: 0, gNext: 0, gStr: '', redact: 0, swap: null, blinkAt: R(1, 6), blinkStart: -9,
    };
    nodes.push(n); cl.members.push(n);
    if (name) byName.set(name, n);
  }
  CLUSTERS.forEach((c, ci) => {
    const cl = { ...c, i: ci, members: [], disp: c.name, ren: null, scrNext: 0, cx: 0, cy: 0, cx0: 0, cy0: 0, rad: 0 };
    clusters.push(cl);
    for (const [name, x, y, r, side] of PEOPLE[c.key]) addNode(name, x, y, r, side || 'r', cl);
    for (const [x, y] of DOTS[c.key]) addNode('', x, y, 4, 'r', cl);
  });
  for (const cl of clusters) {
    for (const n of cl.members) { cl.cx0 += n.hx; cl.cy0 += n.hy; }
    cl.cx0 /= cl.members.length; cl.cy0 /= cl.members.length;
    cl.cx = cl.cx0; cl.cy = cl.cy0;
    for (const n of cl.members) cl.rad = Math.max(cl.rad, Math.hypot(n.hx - cl.cx0, n.hy - cl.cy0));
  }
  const named = nodes.filter((n) => !n.tiny);
  const tinies = nodes.filter((n) => n.tiny);

  const edges = [], edgeKeys = new Set(), nodeEdges = nodes.map(() => []), adj = nodes.map(() => []);
  function addEdge(a, b, kind, bend = 0, badge = 0, thick = 0) {
    if (!a || !b || a === b) return null;
    const k = a.i < b.i ? a.i + '-' + b.i : b.i + '-' + a.i;
    if (edgeKeys.has(k)) return null;
    edgeKeys.add(k);
    const e = { a, b, kind, bend, badge, thick, ph: R(0, TAU), wf: R(0.2, 0.7), cx: 0, cy: 0, bTxt: badge ? String(badge) : '', bUntil: 0 };
    edges.push(e);
    nodeEdges[a.i].push(e); nodeEdges[b.i].push(e);
    adj[a.i].push(b); adj[b.i].push(a);
    a.deg++; b.deg++;
    return e;
  }
  const N = (name) => byName.get(name);
  for (const [a, b, bend, badge, thick] of BRIDGES) addEdge(N(a), N(b), 'bridge', bend, badge, thick);
  for (const [a, b] of STRONG) addEdge(N(a), N(b), 'strong', (srand() - 0.5) * 0.12);
  // the grey web between the hubs
  const hubs = named.filter((n) => n.r >= 9);
  for (let i = 0; i < hubs.length; i++) {
    for (let j = i + 1; j < hubs.length; j++) {
      if (hubs[i].cl !== hubs[j].cl && srand() < 0.2) addEdge(hubs[i], hubs[j], 'gray', (srand() - 0.5) * 0.4);
    }
  }
  for (const n of named) {
    if (srand() < 0.55) {
      const others = named.filter((m) => m.cl !== n.cl);
      addEdge(n, others[(srand() * others.length) | 0], 'dash', (srand() - 0.5) * 0.3);
    }
    if (!nodeEdges[n.i].some((e) => e.kind === 'strong')) {
      let best = null, bd = 1e9;
      for (const m of n.cl.members) if (m !== n && m.r >= 9) { const d = dist(n, m); if (d < bd) { bd = d; best = m; } }
      addEdge(n, best, 'gray', (srand() - 0.5) * 0.2);
    }
  }
  for (const t of tinies) {
    const pool = t.cl.members.filter((m) => !m.tiny).sort((a, b) => dist(t, a) - dist(t, b));
    addEdge(t, pool[0], 'tiny', (srand() - 0.5) * 0.15);
    if (srand() < 0.5) {
      const hub = pool.slice().sort((a, b) => b.r - a.r)[0];
      addEdge(t, hub, 'tiny', (srand() - 0.5) * 0.2);
    }
  }
  const E = { tiny: [], dash: [], gray: [], strong: [], bridgeThin: [], bridgeThick: [], bridge: [] };
  for (const e of edges) {
    if (e.kind === 'bridge') { E.bridge.push(e); (e.thick ? E.bridgeThick : E.bridgeThin).push(e); } else E[e.kind].push(e);
  }
  const pulseEdges = edges.filter((e) => e.kind !== 'tiny');
  const loud = edges.filter((e) => e.kind === 'strong' || e.kind === 'bridge');
  const weighted = [];
  for (const n of named) for (let k = 0; k < n.deg; k++) weighted.push(n);
  const pickNamed = () => pick(named);
  const pickHub = () => pick(weighted);
  const dn = (n) => n.name || '[unnamed]';

  function bfs(a, b) {
    const prev = new Map([[a, null]]), q = [a];
    while (q.length) {
      const n = q.shift();
      if (n === b) break;
      for (const m of adj[n.i]) if (!prev.has(m)) { prev.set(m, n); q.push(m); }
    }
    if (!prev.has(b)) return null;
    const path = [];
    for (let n = b; n; n = prev.get(n)) path.unshift(n);
    return path;
  }

  // ---------- state ----------
  const cv = document.getElementById('board');
  const ctx = cv.getContext('2d');
  const buf = document.createElement('canvas');
  const bctx = buf.getContext('2d');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const slider = document.getElementById('paranoia');
  const pval = document.getElementById('pval');
  const moodEl = document.getElementById('mood');
  const logEl = document.getElementById('log');
  const unrecEl = document.getElementById('unrec');
  const clockEl = document.getElementById('clock');
  const metaEl = document.getElementById('meta');
  const bottomEl = document.getElementById('bottom');
  const topEl = document.querySelector('.top');
  const soundBtn = document.getElementById('sound');

  if (reduced) slider.value = 10;
  let Ptarget = slider.value / 100, P = Ptarget;
  let T = 0, last = performance.now() / 1000;
  let nextEvt = 2.2, nextLog = 0.4, pulseAcc = 0, unrecNext = 7, unrecUntil = 0, nextBeat = 0, gaze = null, gazeNext = 0;
  let hover = null, hoverStart = 0, hoverQuip = '', hoverEdges = [];

    drawClusterLabels();
    drawEdges();
    drawBadges();
    drawStrings();
    drawPulses();
    drawReticle();
    drawNodes();
    drawLabels();
    drawScrawls();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawSpot();
    drawDossier();
    drawFX();
  }

  // ---------- sound ----------
  let AC = null, master = null, noiseBuf = null, soundOn = false;
  function initAudio() {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260; lp.Q.value = 7; lp.connect(master);
    [55, 55.4, 82.6, 110.3].forEach((fq, i) => {
      const o = AC.createOscillator(); o.type = i === 3 ? 'triangle' : 'sawtooth'; o.frequency.value = fq;
      const g = AC.createGain(); g.gain.value = i === 3 ? 0.03 : 0.05;
      o.connect(g).connect(lp); o.start();
    });
    const lfo = AC.createOscillator(); lfo.frequency.value = 0.08;
    const lg = AC.createGain(); lg.gain.value = 140;
    lfo.connect(lg).connect(lp.frequency); lfo.start();
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function env(g, t0, peak, a, d) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
  }
  function tone(type, f0, f1, peak, dur) {
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    env(g, t, peak, 0.004, dur); o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function sfx(kind) {
    if (!soundOn || !AC) return;
    if (kind === 'static') {
      const t = AC.currentTime, src = AC.createBufferSource(), bp = AC.createBiquadFilter(), g = AC.createGain();
      src.buffer = noiseBuf; bp.type = 'bandpass'; bp.frequency.value = R(900, 3500); bp.Q.value = 0.7;
      env(g, t, 0.22, 0.005, R(0.12, 0.3)); src.connect(bp).connect(g).connect(master);
      src.start(t, rand() * 0.5); src.stop(t + 0.4);
    } else if (kind === 'string') tone('triangle', 220, 140, 0.12, 0.5);
    else if (kind === 'beat') tone('sine', 62, 38, 0.32, 0.18);
    else if (kind === 'beat2') tone('sine', 58, 36, 0.2, 0.16);
    else if (kind === 'blip') tone('sine', R(1400, 2600), 1200, 0.02, 0.05);
  }
  soundBtn.addEventListener('click', () => {
    try {
      if (!AC) initAudio();
      AC.resume();
      soundOn = !soundOn;
      master.gain.setTargetAtTime(soundOn ? 0.55 : 0, AC.currentTime, 0.3);
      soundBtn.textContent = soundOn ? 'Sound on' : 'Sound off';
      soundBtn.setAttribute('aria-pressed', String(soundOn));
    } catch (err) {
      soundBtn.textContent = 'No sound here';
      soundBtn.disabled = true;
    }
  });

  // ---------- input ----------
  const MOODS = [[0.15, "it's just a graph"], [0.35, "huh. that's odd"], [0.55, 'wait a minute'], [0.75, "it's all connected"], [0.92, "they know you're looking"], [2, "THEY KNOW YOU'RE LOOKING"]];
  function syncSlider() {
    Ptarget = slider.value / 100;
    pval.textContent = slider.value;
    moodEl.textContent = MOODS.find((m) => Ptarget < m[0])[1];
  }
  slider.addEventListener('input', syncSlider);
  syncSlider();
  document.getElementById('connect').addEventListener('click', () => evString(null, true));

  cv.addEventListener('pointerdown', (ev) => {
    mouse.down = true; mouse.dragged = false;
    mouse.px = mouse.ox = ev.clientX; mouse.py = mouse.oy = ev.clientY;
    mouse.sx = ev.clientX; mouse.sy = ev.clientY; mouse.in = true; mouse.seen = true; mouse.touchOff = 0;
    cv.setPointerCapture(ev.pointerId);
  });
  cv.addEventListener('pointermove', (ev) => {
    mouse.sx = ev.clientX; mouse.sy = ev.clientY;
    if (ev.pointerType === 'mouse') { mouse.in = true; mouse.seen = true; }
    if (!mouse.down) return;
    if (Math.hypot(ev.clientX - mouse.ox, ev.clientY - mouse.oy) > 6) mouse.dragged = true;
    if (mouse.dragged) {
      cam.x -= (ev.clientX - mouse.px) / S; cam.y -= (ev.clientY - mouse.py) / S;
      cam.x = clamp(cam.x, 0, 2000); cam.y = clamp(cam.y, 0, 1182);
      cam.manX = cam.x; cam.manY = cam.y; cam.manUntil = T + 8;
    }
    mouse.px = ev.clientX; mouse.py = ev.clientY;
  });
  cv.addEventListener('pointerup', (ev) => {
    mouse.down = false;
    if (ev.pointerType !== 'mouse') mouse.touchOff = T + 1.5;
    if (mouse.dragged) return;
    const [wx, wy] = toWorld(ev.clientX, ev.clientY);
    let best = null, bd = 1e9;
    for (const n of nodes) { const d = Math.hypot(n.x - wx, n.y - wy) - n.r; if (d < bd) { bd = d; best = n; } }
    if (best && bd < 12 / S + 4) {
      evInspect(best);
      if (best.name) evString(best, true);
    } else {
      log(`observer clicked ${wx | 0},${wy | 0}. noted.`);
    }
  });
  cv.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') mouse.in = false; });
  cv.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    const [wx, wy] = toWorld(ev.clientX, ev.clientY);
    const before = cam.userZ;
    cam.userZ = clamp(cam.userZ * Math.exp(-ev.deltaY * 0.0015), 0.85, 3.5);
    const k = 1 - before / cam.userZ;
    if (cam.userZ <= 1.04 && T >= cam.manUntil) { cam.manX = cam.x; cam.manY = cam.y; }
    cam.manX += (wx - cam.manX) * k; cam.manY += (wy - cam.manY) * k;
    cam.manUntil = T + 8;
  }, { passive: false });

  // ---------- HUD ticker ----------
  metaEl.textContent = `${named.length} named · ${tinies.length} unnamed · ${clusters.length} cells`;
  const t0 = Date.now();
  setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    clockEl.textContent = `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
  }, 500);

  // ---------- go ----------
  resize();
  if (document.fonts && document.fonts.load) {
    ['600 15px "Source Sans 3"', '700 17px "Source Sans 3"', '26px "Permanent Marker"', '11px "IBM Plex Mono"'].forEach((f) => document.fonts.load(f).catch(() => {}));
  }
  function frame(now) {
    const t = now / 1000;
    const dt = Math.min(0.05, Math.max(0, t - last));
    last = t; T += dt;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
